<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playforge</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    :root { color-scheme: light; --paper: #ffffff; --ink: #0a0a0a; --ink-2: #4b4b4b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "JetBrains Mono", Menlo, monospace; display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--ink); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
    header a { color: var(--ink); text-decoration: none; border-bottom: 1px solid transparent; }
    header a:hover { border-bottom-color: var(--ink); }
    main { display: grid; place-items: center; padding: 20px; }
    canvas { width: min(100%, 960px); aspect-ratio: 4 / 3; background: var(--paper); border: 1px solid var(--ink); }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html">← Back to all games</a>
    <span>No. 001 · Playforge · sketch</span>
  </header>
  <main>
    <canvas id="game" width="800" height="600"></canvas>
  </main>
  <script src="game.js"></script>
</body>
</html>
