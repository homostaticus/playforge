<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3d81" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff3d81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <pattern id="grass" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#143d27"/>
      <rect y="40" width="80" height="40" fill="#0f3120"/>
    </pattern>
    <pattern id="curb" width="14" height="40" patternUnits="userSpaceOnUse">
      <rect width="14" height="20" fill="#e8463e"/>
      <rect y="20" width="14" height="20" fill="#f4f4f4"/>
    </pattern>
    <!-- Same car the game draws, with headlights on -->
    <g id="car">
      <polygon points="4,2 42,2 66,-120 -20,-120" fill="url(#beam)"/>
      <g fill="#07080d">
        <rect x="-5" y="10" width="5" height="18"/>
        <rect x="46" y="10" width="5" height="18"/>
        <rect x="-5" y="52" width="5" height="18"/>
        <rect x="46" y="52" width="5" height="18"/>
      </g>
      <rect width="46" height="80" rx="10" fill="currentColor"/>
      <rect x="7" y="18" width="32" height="14" fill="#9fd3f0"/>
      <rect x="7" y="54" width="32" height="10" fill="#9fd3f0"/>
      <rect x="5" y="76" width="10" height="4" rx="2" fill="#ff2a2a"/>
      <rect x="31" y="76" width="10" height="4" rx="2" fill="#ff2a2a"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- The road, tilted so it cuts across the cover -->
  <g transform="rotate(-16 400 250)">
    <rect x="-200" y="-300" width="1200" height="1100" fill="url(#grass)"/>
    <rect x="186" y="-300" width="14" height="1100" fill="url(#curb)"/>
    <rect x="600" y="-300" width="14" height="1100" fill="url(#curb)"/>
    <rect x="200" y="-300" width="400" height="1100" fill="#2b2f3b"/>
    <g stroke="#f3c43a" stroke-width="6" stroke-dasharray="46 46">
      <line x1="333" y1="-300" x2="333" y2="800"/>
      <line x1="467" y1="-300" x2="467" y2="800"/>
    </g>

    <!-- speed lines -->
    <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round">
      <line x1="240" y1="330" x2="240" y2="470"/>
      <line x1="560" y1="250" x2="560" y2="420"/>
      <line x1="430" y1="420" x2="430" y2="520"/>
    </g>

    <g transform="translate(232 -40) scale(1.5)" style="color:#3a62d6"><use href="#car"/></g>
    <g transform="translate(498 60) scale(1.5)" style="color:#f3c43a"><use href="#car"/></g>
    <g transform="translate(232 330) scale(1.5)" style="color:#2fa386"><use href="#car"/></g>

    <!-- the player -->
    <ellipse cx="400" cy="300" rx="120" ry="140" fill="url(#halo)"/>
    <g transform="translate(358 220) scale(1.85)" style="color:#ff3d81"><use href="#car"/></g>
  </g>

  <rect width="800" height="500" fill="url(#vignette)"/>
</svg>
